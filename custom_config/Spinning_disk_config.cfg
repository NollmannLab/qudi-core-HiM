#  Example qudi-core configuration file.
#

global:
  startup_modules: []

# -----------------------------------------------------------------------------------------------------
# HARDWARE setup - indicate all hardware and interfuse backends connected to the instrument
# -----------------------------------------------------------------------------------------------------

hardware:

# High-level hardware
# -------------------

  celesta:
    module.Class: 'laser.lumencor_celesta.LumencorCelesta'
    options:
      ip: '192.168.201.200'
      wavelengths:
        - "405 nm"
        - "446 nm"
        - "477 nm"
        - "520 nm"
        - "546 nm"
        - "638 nm"
        - "750 nm"

  ms2000:
    module.Class: 'multi_axis_translation_stage.MS2000_ASI.MS2000'
    options:
      com_port: '/dev/serial/by-id/usb-Silicon_Labs_CP2101_USB_to_UART_Bridge_Controller_0001-if00-port0'
      baud_rate: '9600'  # '115200'
      first_axis_property:
        label: 'x'
        max_velocity: 7500.0  # µm/s
      second_axis_property:
        label: 'y'
        max_velocity: 7500.0  # µm/s
      LED connected: false

  hamilton_valve:
    module.Class: 'fluidics_valve.hamilton_valve.HamiltonValve'
    options:
      com_port: '/dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller_D-if00-port0'
      num_valves: 2
      daisychain_ID:
          - 'a'
          - 'b'
      name:
          - 'Buffer 8-way valve'
          - 'RT rinsing 2-way valve'
      number_outputs:
          - 8
          - 2
      valve_positions:
          - - '1'
            - '2'
            - '3'
            - '4'
            - '5'
            - '6'
            - '7'
            - '8'
          - - '1: Inject probe'
            - '2: Rinse needle'

  fluigent_flow_sensor:
    module.Class: 'interfuse_hardware.fluigent_flow_sensor.FluigentFlowSensor'
    connect:
      sdk: 'fluigent_sdk'
    options:
      unit: "µl/min"
      sensor_channel_IDs:
        - 0

  pipetting_robot:
    module.Class: 'interfuse_hardware.pipetting_robot.PipettingRobot'
    connect:
      motor: 'pi_multi_axis_stage'
    options:
      exp_setup: 'spinning_disk'
      grid: 'polar'  # 'cartesian'
      r_positions: 3
      phi_positions: 36
      delta_x: 0.0  # in µm
      delta_y: 0.0  # in µm
      delta_r: -20000.0  # in µm
      delta_phi: -10.0  # in degree

      first_axis: 'r'
      second_axis: 'phi'
      z_axis: 'z'

      z_safety_position: 15000.0  # in µm
      parking_position:
        r: 0.0
        phi: 0.0
        z: 0.0
      park_on_deactivate: true

      tube_types:
        - '2mL flat tube'
        - '2mL round tube'
      pos1_axis_1_default: 44000.0  # in µm
      pos1_axis_2_default: 1.0  # in degree
      pos1_axis_3_default:
        - 65000.0  # in µm
        - 65000.0  # in µm

  rinsing_pump:
    module.Class: 'interfuse_hardware.daq_pump_controller.DaqPumpController'
    connect:
      daq: 'daq'
    options:
      kind: "voltage"
      unit: "V"
      minimum: 0.0
      maximum: 3.0
      output_task: 'rinsing_pump'

  fluidics_pump:
    module.Class: 'interfuse_hardware.daq_pump_controller.DaqPumpController'
    connect:
      daq: 'daq'
    options:
      kind: "voltage"
      unit: "V"
      minimum: 0.0
      maximum: 3.0
      output_task: 'fluidics_pump'


# Low-level hardware
# --------------------

  fluigent_sdk:
    module.Class: 'fluidics.fluigent_sdk.FluigentSDK'

  pi_multi_axis_stage:
      module.Class: 'multi_axis_translation_stage.PI_multi_axis_stage.PIMultiAxisStage'
      options:
          connection_mode: 'individual_linux'
          axes:
            r:
              controller_name: 'C-863'
              serialnumber: '/dev/serial/by-id/usb-PI_PI_C-863_Mercury-if00-port0'
              type: 'linear'
              reference_mode: 'FNL'
              velocity_max: 20000.0  # µm/s

            phi:
              controller_name: 'C-867'
              serialnumber: '/dev/serial/by-id/usb-PI_PI_C-867_Piezomotor_Controller_14ASKLJ_-if00-port0'
              type: 'rotation'
              reference_mode: 'FRF'
              velocity_max: 20000.0  # µm/s

            z:
              controller_name: 'C-863'
              serialnumber: '/dev/serial/by-id/usb-PI_PI_C-863_Mercury_16HU24A_-if00-port0'
              type: 'linear'
              reference_mode: 'FNL'
              velocity_max: 20000.0  # µm/s

  daq:
    module.Class: 'daq.Measurement_Computing_daq.MccDAQ'
    options:
      read_write_timeout: 10
      ao_channels:
         fluidics_pump:
           - 0  # physical channel on the daq
           - UNI10VOLTS # voltage range defined by the spec of the connected device. Here [-10, 10] V.
         rinsing_pump:
           - 1
           - UNI10VOLTS
        # laser_405:
        #   - '/Dev1/AO0'
        #   - [0, 10]
      ai_channels:
#          example
#            - 0  # physical channel on the daq
#            - UNI10VOLTS # voltage range defined by the spec of the connected device. Here [-10, 10] V.
#            - SINGLE_ENDED  # DIFFERENTIAL
      do_channels:
      di_channels:

# -----------------------------------------------------------------------------------------------------
# LOGIC setup - indicate all logics that are required for controlling the instrument
# -----------------------------------------------------------------------------------------------------

logic:
  fluidics_valve_logic:
    module.Class: 'fluidics_valve_logic.FluidicsValveLogic'
    connect:
      valve: 'hamilton_valve'

  fluidics_flow_logic:
    module.Class: 'fluidics_flow_logic.FluidicsFlowLogic'
    options:
      default_pressure_channel: 0
      default_sensor_channel: 0
      sampling_interval: 1.0

      p_gain: 0.005
      i_gain: 0.01
      d_gain: 0.0
      pid_sample_time: 0.1
      pid_output_min: 0
      pid_output_max: 15

      rinsing_valve_positions:
        a: 3
        b: 2
      restore_valves_after_rinsing: True

    connect:
      flow_sensor: 'fluigent_flow_sensor'
      fluidics_pump: 'fluidics_pump'
      rinsing_pump : 'rinsing_pump'
      valve_logic : 'fluidics_valve_logic'

  roi_logic:
    module.Class: 'roi_logic.RoiLogic'
    connect:
      stage: 'ms2000'
    options:
      x_axis_label: 'x'
      y_axis_label: 'y'
      z_axis_label: 'z'

  pipetting_robot_logic:
    module.Class: 'fluidics_robot_logic.FluidicsRobotLogic'
    connect:
      robot: 'pipetting_robot'
    options:
      movement_poll_interval: 0.5  # is s - to probe the stage position

  injections_logic:
    module.Class: 'injections_logic.InjectionsLogic'
    options:
      probe_valve_number: 7
      number_of_valve_positions: 8
      number_of_probes: 100

  task_runner:
    module.Class: 'taskrunner_logic.TaskRunnerLogic'
    options:
      module_tasks:
        dummy_fluidics:
          module.Class: 'qudi.tasks.dummy_fluidics_task.TestTask'
          connect:
            pipetting_robot: pipetting_robot_logic
            fluidics_valve: fluidics_valve_logic
            fluidics_flow: fluidics_flow_logic

# -----------------------------------------------------------------------------------------------------
# GUI setup - indicate all user-interface available for the current setup
# -----------------------------------------------------------------------------------------------------

gui:
  roi_gui:
    module.Class: 'roi_manager.roi_gui.RoiGUI'
    connect:
      roi_logic: 'roi_logic'
    options:
      stagemarker_width: 300
      default_path: 'C:\\Users\\CBS\qudi_files\qudi_roi_lists'

  fluidics_gui:
    module.Class: 'fluidics.fluidics_gui.FluidicsGUI'
    connect:
      valve_logic: 'fluidics_valve_logic'
      fluidics_logic: 'fluidics_flow_logic'
      pipetting_robot_logic: 'pipetting_robot_logic'

  injection_gui:
    module.Class: 'injections_setup.injections_gui.InjectionsGUI'
    connect:
      valve_logic: 'injections_logic'
    options:
      default_path: ""

  task_runner_gui:
    module.Class: 'task_runner.task_runner_gui.TaskRunnerGui'
    connect:
      task_runner: 'task_runner'