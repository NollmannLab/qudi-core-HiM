#  Example qudi-core configuration file.
#

global:
  startup_modules: []

# -----------------------------------------------------------------------------------------------------
# HARDWARE setup - indicate all hardware and interfuse backends connected to the instrument
# -----------------------------------------------------------------------------------------------------

hardware:

# High-level hardware
# -------------------

  widefield_camera:
    module.Class: 'camera.hamamatsu.orca_flash4.HCam'
    options:
      camera_name: 'widefield_camera'
      camera_id: 0  # index of the camera in the DCAM-API device list
      temperature_control: False
      gain_control: False
      mechanical_shutter: False
      support_live_acquisition: True
      frame_transfer: False
      default_exposure: 0.05  # in s
      default_trigger_mode: 'INTERNAL'  # 'INTERNAL', 'EXTERNAL', 'SOFTWARE' or 'MASTERPULSE'
      default_exposure_out_mode: 'ALL_ROWS'  # 'ALL_ROWS' or 'FIRST_ROW' (same keywords as the Kinetix camera)
      max_N_images_movie: 1000
      live_buffer_frames: 10  # size (in frames) of the DCAM ring buffer used during live acquisition
      trigger_ready_channel: 1  # output trigger connector (0-based) sending the 'trigger ready' signal
      exposure_out_channel: 2  # output trigger connector (0-based) sending the 'exposure' signal
      output_trigger_polarity: 'NEGATIVE'  # polarity of the two output triggers

  opm_camera:
    module.Class: 'camera.teledyne.kinetix.KinetixCam'
    options:
      camera_name: 'widefield_camera'
      resolution:
        - 2048
        - 2048
      temperature_control: False
      gain_control: False
      mechanical_shutter: False
      support_live_acquisition: True
      frame_transfer: False
      default_exposure: 0.05  # in s
      default_acquisition_mode: 'Dynamic Range'  # for 16-bit images
      default_trigger_mode: 'INTERNAL'
      default_exposure_out_mode: 'ALL_ROWS'
      max_N_images_movie: 205

  tiger:
    module.Class: 'multi_axis_translation_stage.tiger_ASI.Tiger'
    options:
      com_port: 'COM6'  #'/dev/ttyUSB0'
      baud_rate: 115200
      card_address: 7
      first_axis_property:
        label: 'x'
        max_velocity: 7500.0  # µm/s
      second_axis_property:
        label: 'y'
        max_velocity: 7500.0  # µm/s
      third_axis_property:
        label: 'z'
        max_velocity: 1900.0  # µm/s
      LED connected: True

  daq_laser:
    module.Class: 'interfuse_hardware.daq_laser_controller.DaqLaserController'
    connect:
      daq: 'nidaq_6738'
    options:
      blanking_channel:
        enabled_voltage: 10
        disabled_voltage: 0
        daq_task: 'blanking'
      laser_channels:
        561:
          daq_task: 'laser_561'

  dummy_filter_wheel:
    module.Class: 'filter_wheel.dummy_filter_wheel.DummyFilterWheel'
    options:
      filter_definitions:
        - position: 1
          name: 700 +/- 37 nm
          allowed_wavelengths_nm:
            - 561

# Low-level hardware
# --------------------
  nidaq_6738:
    module.Class: 'daq.NI_daq.NIDAQ'
    options:
      read_write_timeout: 10
      ao_channels:
        laser_561:
          - '/Dev1/AO30'
          - [0, 10]
        blanking:
          - '/Dev1/AO31'
          - [0, 10]

# -----------------------------------------------------------------------------------------------------
# LOGIC setup - indicate all logics that are required for controlling the instrument
# -----------------------------------------------------------------------------------------------------

logic:

  camera_logic:
    module.Class: 'camera_logic.CameraLogic'
    connect:
      hardware: 'opm_camera'
    options:
      max_live_speed_(fps): 20  # in frame per second
      fileformat_list:
        - 'tif'
        - 'ome-tif'
        - 'fits'
        - 'npy'
        - 'hdf5'

  laser_control_logic:
    module.Class: 'laser_control_logic.LaserControlLogic'
    connect:
      filter_wheel: 'dummy_filter_wheel'
      laser: 'daq_laser'
    options:
      optical_path:
        dichroic_ref: ZT405-488-561-640rpcv2
        dichroic_allowed_wavelengths_nm:
          - 561

  filter_wheel_logic:
    module.Class: 'filter_wheel_logic.FilterWheelLogic'
    connect:
      laser_logic: 'laser_control_logic'
      filter_wheel: 'dummy_filter_wheel'

  roi_logic:
    module.Class: 'roi_logic.RoiLogic'
    connect:
      stage: 'tiger'
    options:
      x_axis_label: 'x'
      y_axis_label: 'y'
      z_axis_label: 'z'

  task_runner:
    module.Class: 'taskrunner_logic.TaskRunnerLogic'
    options:
      module_tasks:
        dummy_fluidics:
          module.Class: 'qudi.tasks.dummy_fluidics_task.TestTask'
          connect:
            pipetting_robot: pipetting_robot_logic
            fluidics_valve: fluidics_valve_logic
            fluidics_flow: fluidics_flow_logic

# -----------------------------------------------------------------------------------------------------
# GUI setup - indicate all user-interface available for the current setup
# -----------------------------------------------------------------------------------------------------

gui:
  basic_imaging:
    module.Class: 'basic_imaging.basic_imaging_gui.BasicImagingGUI'
    connect:
      laser_logic: 'laser_control_logic'
      filter_wheel_logic: 'filter_wheel_logic'
      camera_logic: 'camera_logic'
    options:
      default_path: 'D:\DATA'
      metadata_template: 'C:\Users\JB\Repositories\qudi-core-HiM\custom_config\custom_metadata_templates\OPM_setup.cfg'

  roi_gui:
    module.Class: 'roi_manager.roi_gui.RoiGUI'
    connect:
      roi_logic: 'roi_logic'
    options:
      stagemarker_width: 300
      default_path: 'C:\\Users\\CBS\qudi_files\qudi_roi_lists'

  task_runner_gui:
    module.Class: 'task_runner.task_runner_gui.TaskRunnerGui'
    connect:
      task_runner: 'task_runner'