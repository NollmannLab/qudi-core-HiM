experiment: ROI multicolor scan Airyscan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: ROI_multicolor_scan_task_AIRYSCAN.yml

fields:

  sample_name:
    required: true
    default: ""

  dapi:
    required: false
    default: false

  rna:
    required: false
    default: false

  imaging_sequence:
    required: true
    default: []
    model: standard

  save_path:
    required: true
    default_from: default_path_imagedata

  num_z_planes:
    required: true
    default: 1
    minimum: 1

  roi_list_path:
    required: true
    default: ""