experiment: ROI multicolor scan Airyscan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: ROI_multicolor_scan_task_AIRYSCAN.yaml

fields:

  sample_name:
    required: true
    default: ""

  # tag of the run folder and file names: DAPI, RNA, IF or a free tag (letters, digits and '-')
  sample_tag:
    required: true
    default: "DAPI"

  imaging_sequence:
    required: true
    default: []
    model: standard

  save_path:
    required: true
    default_from: default_path_imagedata

  num_z_planes:
    required: true
    default: 1
    minimum: 1

  roi_list_path:
    required: true
    default: ""