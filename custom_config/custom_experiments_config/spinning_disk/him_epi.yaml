experiment: him_epi_sd

description: >
  Configure a Hi-M experiment using the Spining disk microscope in
  epifluorescence mode.

output_filename: him_task_sd_epi.yaml

fields:

  sample_name:
    required: true
    default: ""

  imaging_sequence:
    required: true
    default: []
    model: standard

  roi_list_path:
    required: true
    default: ""

  injections_path:
    required: true
    default: ""

  zen_ref_images_path:
    required: true
    default: ""

  # not used: the run folder is created by qudi
  zen_saving_path:
    visible: false
    required: false
    default: ""

  # run folder created by qudi: on save_network_path (server) when it is writable, otherwise in save_path
  save_path:
    required: true
    default_from: default_path_imagedata

  save_network_path:
    required: false
    default_from: default_network_path

  transfer_data:
    visible: false
    required: false
    default: false

  email:
    visible: false
    required: false
    default: ""

  correlation_threshold:
    required: true
    default: 0.6
