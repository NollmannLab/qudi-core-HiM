experiment: him_epi_sd

description: >
  Configure a Hi-M experiment using the Spining disk microscope in
  epifluorescence mode.

output_filename: him_task_sd_epi.yaml

fields:

  sample_name:
    required: true
    default: ""

  imaging_sequence:
    required: true
    default: []
    model: standard

  roi_list_path:
    required: true
    default: ""

  injections_path:
    required: true
    default: ""

  zen_ref_images_path:
    required: true
    default: ""

  # folder where ZEN creates the data folder of the experiment (only read by qudi)
  zen_saving_path:
    required: true
    default: ""

  # qudi's files in <save_network_path (server) when reachable, otherwise save_path>/<ZEN folder name>/metadata
  save_path:
    required: true
    default_from: default_path_imagedata

  save_network_path:
    required: false
    default_from: default_network_path

  transfer_data:
    visible: false
    required: false
    default: false

  email:
    visible: false
    required: false
    default: ""

  # autofocus check: ZNCC threshold (-1..1) and minimum fraction (0..1) of ROIs per cycle that must pass
  correlation_threshold:
    required: true
    default: 0.6

  autofocus_min_fraction:
    required: true
    default: 0.9
