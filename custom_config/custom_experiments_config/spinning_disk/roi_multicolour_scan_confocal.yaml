experiment: roi_multicolor_scan_confocal

description: >
  Configure a confocal acquisition over a predefined ROI list (on the spinning disk microscope).

output_filename: roi_multicolor_scan_task_confocal.yml

fields:

  sample_name:
    required: true
    default: ""

  save_path:
    required: true
    default_from: default_path_imagedata

  roi_list_path:
    required: true
    default: ""
