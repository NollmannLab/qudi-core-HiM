experiment: roi_multicolor_scan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: roi_multicolor_scan_task_sd.yaml

fields:

  sample_name:
    required: true
    default: ""

  dapi:
    required: false
    default: false

  rna:
    required: false
    default: false

  imaging_sequence:
    required: true
    default: []
    model: standard

  # data folder created by ZEN in zen_saving_path when the experiment starts; qudi writes its files in
  # its "metadata" subfolder (save_path is not used by the SD ROI scan)
  save_path:
    visible: false
    required: false
    default_from: default_path_imagedata

  roi_list_path:
    required: true
    default: ""

  zen_saving_path:
    required: true
    default: ""
