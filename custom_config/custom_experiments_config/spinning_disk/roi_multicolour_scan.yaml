experiment: roi_multicolor_scan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: roi_multicolor_scan_task_sd.yaml

fields:

  sample_name:
    required: true
    default: ""

  dapi:
    required: false
    default: false

  rna:
    required: false
    default: false

  imaging_sequence:
    required: true
    default: []
    model: standard

  # run folder created by qudi: on save_network_path (server) when it is writable, otherwise in save_path
  save_path:
    required: true
    default_from: default_path_imagedata

  save_network_path:
    required: false
    default_from: default_network_path

  roi_list_path:
    required: true
    default: ""

  # not used: the run folder is created by qudi
  zen_saving_path:
    visible: false
    required: false
    default: ""
