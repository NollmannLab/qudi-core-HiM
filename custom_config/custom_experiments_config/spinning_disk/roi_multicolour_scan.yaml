experiment: roi_multicolor_scan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: roi_multicolor_scan_task_sd.yaml

fields:

  sample_name:
    required: true
    default: ""

  dapi:
    required: false
    default: false

  rna:
    required: false
    default: false

  imaging_sequence:
    required: true
    default: []
    model: standard

  save_path:
    required: true
    default_from: default_path_imagedata

  roi_list_path:
    required: true
    default: ""
