experiment: roi_multicolor_scan

description: >
  Configure a multicolor Airyscan acquisition over a predefined ROI list.

output_filename: roi_multicolor_scan_task_sd.yaml

fields:

  sample_name:
    required: true
    default: ""

  # tag of the run folder and file names: DAPI, RNA, IF or a free tag (letters, digits and '-')
  sample_tag:
    required: true
    default: "DAPI"

  # sample file (YAML describing the biological sample, edited from the configurator): copied as sample.yml
  # into the metadata folder of the run and added as the 'Sample' section of metadata.yml
  sample_file:
    required: true
    default: ""

  imaging_sequence:
    required: true
    default: []
    model: standard

  # qudi's files in <save_network_path (server) when reachable, otherwise save_path>/<ZEN folder name>/metadata
  save_path:
    required: true
    default_from: default_path_imagedata

  save_network_path:
    required: false
    default_from: default_network_path

  roi_list_path:
    required: true
    default: ""

  # folder where ZEN creates the data folder of the experiment (only read by qudi)
  zen_saving_path:
    required: true
    default: ""
