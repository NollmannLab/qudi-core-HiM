experiment: hi_m
description: Configure a Hi-M experiment on the spinning disk microscope using Epi imaging - Fluidics / ROI / ZEN configuration / Imaging sequence and saving parameters are defined.
  ROI imaging and fluidics sequences.
output_filename: hi_m_epi_task_sd.yaml
fields:
  sample_name:
    visible: true
    required: true
    default: ''
  save_path:
    visible: true
    required: false
    default_from: default_path_imagedata
  imaging_sequence:
    visible: true
    required: true
    default: []
    model: standard
  num_z_planes:
    visible: true
    required: false
    default: 1
  roi_list_path:
    visible: true
    required: true
    default: ''
  injections_path:
    visible: true
    required: true
    default: ''
  dapi_path:
    visible: true
    required: false
    default: ''
