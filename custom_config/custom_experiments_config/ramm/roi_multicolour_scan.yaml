experiment: roi_multicolor_scan

description: >
  Configure a multicolor z-stack acquisition over a predefined ROI list
  on the RAMM microscope.

output_filename: roi_multicolor_scan_task_ramm.yml

fields:

  sample_name:
    required: true
    default: ""

  # tag of the run folder and file names: DAPI, RNA, IF or a free tag (letters, digits and '-')
  sample_tag:
    required: true
    default: "DAPI"

  exposure:
    required: true
    default: 0.05
    minimum: 0.001
    unit: s

  imaging_sequence:
    required: true
    default: []
    model: standard
    additional_sources:
      - Brightfield
      
  filter_pos:
    visible: true
    required: true
    default: 1

  save_path:
    required: true
    default_from: default_path_imagedata

  file_format:
    required: true
    default: tif

  num_z_planes:
    required: true
    default: 1
    minimum: 1

  z_step:
    required: true
    default: 0.2
    unit: µm

  centered_focal_plane:
    required: false
    default: false

  roi_list_path:
    required: true
    default: ""
