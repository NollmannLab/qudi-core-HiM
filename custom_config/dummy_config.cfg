#  Example qudi-core configuration file.
#

global:
  startup_modules: []

hardware:
  dummy_translation_stage:
    module.Class: 'translation_stage.dummy_translation_stage.DummyXYStage'
    options:
        x_min: 0
        x_max: 200
        y_min: 0
        y_max: 200
        z_min: 0
        z_max: 200
        delay_after_move: 0.5
        first_axis_label: 'x'
        second_axis_label: 'y'
        third_axis_label: 'z'

  ms2000:
    module.Class: 'translation_stage.MS2000_ASI.MS2000'
    options:
        com_port: '/dev/ttyUSB0'
        baud_rate: '9600' #'115200'
        first_axis_label: 'x'
        second_axis_label: 'y'
        third_axis_label: 'z'
        delay_after_move: 0.5
        LED connected: True

logic:
  roi_logic:
    module.Class: 'roi_logic.RoiLogic'
    connect:
      stage: 'dummy_translation_stage'

gui:
  roi_gui:
    module.Class: 'roi_manager.roi_gui.RoiGUI'
    connect:
      roi_logic: 'roi_logic'
    options:
        stagemarker_width: 300
        default_path: 'C:\\Users\\CBS\qudi_files\qudi_roi_lists'

