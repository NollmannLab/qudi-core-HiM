#  Example qudi-core configuration file.
#

global:
  startup_modules: []

hardware:
  dummy_translation_stage:
    module.Class: 'translation_stage.dummy_translation_stage.DummyXYStage'
    options:
        x_min: 0
        x_max: 200
        y_min: 0
        y_max: 200
        z_min: 0
        z_max: 200
        delay_after_move: 0.5
        first_axis_label: 'x'
        second_axis_label: 'y'
        third_axis_label: 'z'

  dummy_valve:
    module.Class: 'fluidics_valve.dummy_valve.DummyValve'
    options :
        com_port: '/dev/ttyUSB0'
        num_valves: 3
        daisychain_ID:
            - 'a'
            - 'b'
            - 'c'
        name:
            - 'Buffer 8-way valve'
            - 'RT rinsing 2-way valve'
            - 'Syringe 2-way valve'
        number_outputs:
            - 8
            - 2
            - 2
        valve_positions:
            - - '1'
              - '2'
              - '3'
              - '4'
              - '5'
              - '6'
              - '7'
              - '8'
            - - '1: Rinse needle'
              - '2: Inject probe'
            - - '1: Syringe'
              - '2: Pump'

  dummy_daq:
    module.Class: 'daq.dummy_daq.DummyDaq'
    options:
      read_write_timeout: 10
      ao_voltage_range: [0, 10]
      ao_channels:
        piezo_write: '/Dev1/AO1'
        pump_write: '/Dev1/AO0'
      ai_channels:
        piezo_read: '/Dev1/AI0'
      do_channels:
        start_acquisition: '/Dev1/port0/line7'
      di_channels:
        acquisition_done: '/Dev1/port0/line8'

logic:
  fluidics_valve_logic:
    module.Class: 'fluidics_valve_logic.FluidicsValveLogic'
    connect:
      valve: 'dummy_valve'

  fluidics_flow_logic:
    module.Class: 'fluidics_flow_logic.FluidicsFlowLogic'
    options:
      default_pressure_channel: 0
      default_sensor_channel: 0
      sampling_interval: 1.0
      p_gain: 0.005
      i_gain: 0.01
      d_gain: 0.0
      pid_sample_time: 0.1
      pid_output_min: 0
      pid_output_max: 15
    connect:
      flowboard: 'fluigent_flowboard'

  roi_logic:
    module.Class: 'roi_logic.RoiLogic'
    connect:
      stage: 'dummy_translation_stage'

gui:
  fluidics_gui:
    module.Class: 'fluidics.fluidics_gui.FluidicsGUI'
    options:
      tube_type:
        - '2mL flat tube'
        - '2mL round tube'
      pos1_x_default: 13.0
      pos1_y_default: 4.0
      pos1_z_default:
        - 88.0
        - 87.0
      exp_setup: 'RAMM'
    connect:
      valve_logic: 'fluidics_valve_logic'
      flowcontrol_logic: 'fluidics_flow_logic'

  roi_gui:
    module.Class: 'roi_manager.roi_gui.RoiGUI'
    connect:
      roi_logic: 'roi_logic'
    options:
        stagemarker_width: 300
        default_path: 'C:\\Users\\CBS\qudi_files\qudi_roi_lists'
